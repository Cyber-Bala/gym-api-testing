services:
  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
    networks:
      - gym_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - gym_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://gym_user:gym_password@postgres:5432/gym_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=gym_minio_admin
      - MINIO_SECRET_KEY=gym_minio_secret
      - SESSION_SECRET=dev_session_secret_replace_in_production_32chars
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
      - TIMEZONE=Asia/Kolkata
      - FRONTEND_URL=http://localhost
      - ACCESS_DEVICE_TOKEN=${ACCESS_DEVICE_TOKEN:-dev_access_device_token_secret}
      - API_APP_URL=${API_APP_URL:-http://localhost:8000}
      - PAYU_BACKEND_URL=http://localhost
      - PAYU_ENV=TEST
      - PAYU_BASE_URL=https://test.payu.in/_payment
      - PAYU_MERCHANT_KEY=${PAYU_MERCHANT_KEY:-placeholder_payu_key}
      - PAYU_MERCHANT_SALT=${PAYU_MERCHANT_SALT:-placeholder_payu_salt}
      - PAYU_VERIFICATION_SALT=${PAYU_VERIFICATION_SALT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - gym_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: gym_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gym_user:gym_password@postgres:5432/gym_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=gym_minio_admin
      - MINIO_SECRET_KEY=gym_minio_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network

  postgres:
    image: postgres:16-alpine
    container_name: gym_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
      - "5433:5432" # conflict-free host port: local Windows PostgreSQL already occupies 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  redis:
    image: redis:7-alpine
    container_name: gym_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: gym_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gym_minio_admin
      MINIO_ROOT_PASSWORD: gym_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gym_network

networks:
  gym_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backups_data:
