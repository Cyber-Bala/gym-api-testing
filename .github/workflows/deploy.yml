name: CI/CD Pipeline - College Gym

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vitest Suites (17 Domain Test Files)
        run: npm run test --workspaces

      - name: Run TypeScript & Vite Production Build
        run: npm run build --workspaces

  deploy:
    name: Deploy to Home Server (gym.lazplay.in)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote Deploy on Home Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'rohith' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            chmod +x /home/rohith/college-gym/deploy.sh
            /home/rohith/college-gym/deploy.sh
